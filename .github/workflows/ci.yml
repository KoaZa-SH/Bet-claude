name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BetClaude.sln

      - name: Build
        run: dotnet build BetClaude.sln -c Release --no-restore

      - name: Test
        run: dotnet test BetClaude.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (win-x64, needs the .NET 8 Desktop Runtime on the PC)
        run: dotnet publish src/BetClaude.App/BetClaude.App.csproj -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: BetClaude-win-x64
          path: publish
