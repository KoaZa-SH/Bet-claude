name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BetClaude.sln

      - name: Build
        run: dotnet build BetClaude.sln -c Release --no-restore

      - name: Test
        run: dotnet test BetClaude.sln -c Release --no-build --logger "console;verbosity=normal"
